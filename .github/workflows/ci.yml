name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Restore
        run: dotnet restore
      - name: Build (warnings as errors)
        run: dotnet build -c Release --no-restore
      - name: Format check
        run: dotnet format --verify-no-changes --verbosity diagnostic
        continue-on-error: true
      - name: Tests
        run: dotnet test -c Release --no-build
      - name: Publish smoke (linux-x64 self-contained)
        run: >
          dotnet publish src/IPTraceX.CLI/IPTraceX.CLI.csproj -c Release
          -r linux-x64 --self-contained true -p:PublishSingleFile=true
          -o publish/linux-x64
      - name: Stage production binary
        run: |
          cp publish/linux-x64/IPTraceX ./IPTraceX
          chmod +x ./IPTraceX
          file ./IPTraceX
      - name: CLI smoke
        run: |
          chmod +x iptracex.sh
          ./IPTraceX --version
          ./iptracex.sh --help
          ./iptracex.sh --version
      - name: Email smoke (public sources only, no keys)
        run: |
          ./IPTraceX --json --email user@gmail.com
          smoke_dir=$(mktemp -d)
          cp ./IPTraceX "$smoke_dir/"
          cd "$smoke_dir"
          ./IPTraceX --email user@gmail.com --report txt
          ./IPTraceX --email user@gmail.com --investigate
          ./IPTraceX --list-investigations
          ./IPTraceX --email-file /dev/null || true
      - name: Launcher behavior tests
        run: |
          chmod +x tests/launcher/run_tests.sh
          ./tests/launcher/run_tests.sh
      - name: ShellCheck
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: .
